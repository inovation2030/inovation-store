name: Publicar index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar el archivo subido como index.html
        run: |
          git show HEAD~2:tienda-online-de-blancos-para-el-hogar.html > index.html
          wc -c index.html
          ls -l index.html
          git config user.name "inovation2030"
          git config user.email "inovation2030@users.noreply.github.com"
          git add index.html
          git commit -m "Inovation Store: publicar index.html" || echo "sin cambios que confirmar"
          git push
